[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shallow-water"
version = "0.1.0"
description = "From-scratch 2D shallow-water-equations solver simulating a hurricane-like vortex"
requires-python = ">=3.11"
dependencies = ["numpy", "numba", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
